name: Deploy to Bluehost — cassa.site/courses/ast100

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # fix Node.js 20 deprecation warning

jobs:
  deploy:
    name: Build & Sync to Bluehost
    runs-on: ubuntu-latest

    steps:
      # 1. Pull your repo code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node 24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24        # upgraded from 20

      # 3. Install dependencies & build Astro
      - name: Install & build
        run: |
          npm install             # changed from npm ci (no lock file needed)
          npm run build

      # 4. Deploy /dist to Bluehost via rsync over SSH
      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git*' --exclude='node_modules' --exclude='.env*'
          path: ./dist/
          remote_path: ~/public_html/courses/ast100
          remote_host: ${{ secrets.BLUEHOST_HOST }}
          remote_user: ${{ secrets.BLUEHOST_USER }}
          remote_key: ${{ secrets.BLUEHOST_SSH_KEY }}
